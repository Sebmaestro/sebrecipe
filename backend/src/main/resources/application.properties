spring.application.name=backend

# PostgreSQL. The defaults below are for local development only; every value can
# be overridden with an environment variable in production.
spring.datasource.url=${SEBRECIPE_DB_URL:jdbc:postgresql://localhost:5432/sebrecipe}
spring.datasource.username=${SEBRECIPE_DB_USERNAME:sebrecipe}
spring.datasource.password=${SEBRECIPE_DB_PASSWORD:sebrecipe_dev}

# JPA settings
spring.jpa.hibernate.ddl-auto=${SEBRECIPE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
